name: CI — Quality Gate

# Only runs what changed. Skips entirely on docs/config-only changes.
# Mobile-only change? Backend skipped. Backend-only? Mobile skipped.
# Saves ~50% Actions minutes vs running everything every time.

on:
  push:
    branches: [integration]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main, integration]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'docs/**'
      - '.vscode/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect what changed ───────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      mobile:  ${{ steps.filter.outputs.mobile }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
            backend:
              - 'backend/**'

  # ── Mobile: TypeScript + Tests ────────────────────────────
  mobile:
    name: 📱 Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - run: npm install --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest tests/unit --no-coverage --ci

  # ── Backend: Tests with real DB ───────────────────────────
  backend:
    name: 🖥️ Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eclean
          POSTGRES_PASSWORD: eclean_ci
          POSTGRES_DB: eclean_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://eclean:eclean_ci@localhost:5432/eclean_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-that-is-at-least-32-characters-long
      BCRYPT_ROUNDS: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

  # ── Gate: pass if relevant jobs passed (or were skipped) ──
  ci-passed:
    name: ✅ CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [mobile, backend]
    if: always()
    steps:
      - name: Check results
        run: |
          MOBILE="${{ needs.mobile.result }}"
          BACKEND="${{ needs.backend.result }}"

          echo "Mobile: $MOBILE | Backend: $BACKEND"

          # "skipped" is OK (means no files changed in that area)
          # "success" is OK
          # anything else = failure
          if [[ "$MOBILE" != "success" && "$MOBILE" != "skipped" ]]; then
            echo "❌ Mobile failed"
            exit 1
          fi
          if [[ "$BACKEND" != "success" && "$BACKEND" != "skipped" ]]; then
            echo "❌ Backend failed"
            exit 1
          fi
          echo "✅ All checks passed"
