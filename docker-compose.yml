services:
  db:
    image: postgres:16-alpine
    container_name: eclean_db
    environment:
      POSTGRES_DB: eclean_dev
      POSTGRES_USER: ${POSTGRES_USER:-eclean}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eclean_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eclean -d eclean_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eclean_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-eclean_dev_redis}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-eclean_dev_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
